
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <main class="login-wrapper">

        <header class="login-header">
            <div class="campus-icon">🏫</div>

            <h1>Student Attendance Management System</h1>

            <p>Smart attendance tracking &amp; parent notifications</p>
        </header>

        <section class="login-card">

            <div class="login-card-heading">
                <div class="login-icon">🔐</div>
                <h2>Faculty Login</h2>
                <p>Sign in to manage student attendance</p>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <label class="show-password">
                    <input type="checkbox" id="showPassword">
                    <span>Show password</span>
                </label>

                <button type="submit" class="login-button">
                    Sign In <span aria-hidden="true">→</span>
                </button>

            </form>

            <p id="message" class="login-message" role="status"></p>

            <div class="login-footer">
                <span>🛡️</span>
                <span>Faculty access portal</span>
            </div>

        </section>

        <footer class="page-footer">
            Student Attendance Management System
        </footer>

    </main>

    <script src="script.js"></script>

    <script>
        const showPasswordCheckbox =
            document.getElementById("showPassword");

        showPasswordCheckbox.addEventListener("change", function () {
            document.getElementById("password").type =
                this.checked ? "text" : "password";
        });
    </script>

</body>
</html>
